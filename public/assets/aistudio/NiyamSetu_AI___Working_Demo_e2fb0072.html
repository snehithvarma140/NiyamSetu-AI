<script>

document.addEventListener("pointermove",e=>{const b=e.target.closest&&e.target.closest(".box:not(.tw)");if(!b||matchMedia("(prefers-reduced-motion:reduce)").matches)return;const r=b.getBoundingClientRect();b.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*6+"deg");b.style.setProperty("--rx",(.5-(e.clientY-r.top)/r.height)*6+"deg")});

const t=document.createElement("canvas");t.width=256;t.height=64;const x=t.getContext("2d");x.font="600 30px system-ui";x.fillStyle=cs.getPropertyValue("--tx").trim();x.textAlign="center";x.fillText(n,128,42);
const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(t),transparent:true}));sp.scale.set(1.6,.4,1);sp.position.copy(m.position);sp.position.y+=.42;g.add(sp);
g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),m.position]),new THREE.LineBasicMaterial({color:mu,transparent:true,opacity:.5})))});
const rings=[0,1,2].map(i=>{const r=new THREE.Mesh(new THREE.RingGeometry(.97,1,64),new THREE.MeshBasicMaterial({color:ac,transparent:true,side:2}));r.rotation.x=Math.PI/2;r.userData.p=i/3;g.add(r);return r});
let mx=0,my=0,t0=0,id;const mv=e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5};addEventListener("pointermove",mv);
